gripper_ft_node:
  ros__parameters:
    serial_port: /dev/ttyUSB0
    baud_rate: 921600
    frame_id: gripper_ft_sensor
    sensor_id: gripper_ft_node
    expected_serial_number: ""
    query_serial_number_on_start: true
    require_serial_match: false
    data_topic: /gripper_ft/data
    raw_topic: /gripper_ft/raw
    publish_raw: false
    response_timeout: 1.0
    reconnect_interval: 2.0
