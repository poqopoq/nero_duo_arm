# LeRobot 0.6.2 remote policy server template for one NERO arm.
#
# Copy this file to the GPU host and replace model.repo_or_path before use.
# action_fps must equal the checkpoint's action rate and the rollout --fps.
# The value below is intentionally conservative for the first integration run.
deployment: nero-single
model:
  repo_or_path: /absolute/path/to/nero_single_checkpoint
  revision: null
  device: cuda
execution:
  supported_modes: [chunk]
  action_fps: 5.0
  action_deadline_s: 5.0
  idle_timeout_s: 10.0
  warmup_calls: 2
language:
  enabled: false
zenoh:
  mode: peer
  listen_endpoints: [tcp/0.0.0.0:7447]
semantics: nero-ee-metres-axis-angle-gripper-normalized-v1
robot_type: nero_ros
features:
  - name: observation.state
    shape: [7]
    dtype: float32
    names:
      - ee.x.pos
      - ee.y.pos
      - ee.z.pos
      - ee.rx.pos
      - ee.ry.pos
      - ee.rz.pos
      - ee.gripper.pos
    semantics: nero-ee-metres-axis-angle-gripper-normalized-v1
  - name: observation.images.camera1
    shape: [480, 640, 3]
    dtype: uint8
    kind: rgb
    semantics: rgb-front-table-v1
action_feature:
  name: action
  shape: [7]
  dtype: float32
  names:
    - ee.x.pos
    - ee.y.pos
    - ee.z.pos
    - ee.rx.pos
    - ee.ry.pos
    - ee.rz.pos
    - ee.gripper.pos
  semantics: nero-ee-metres-axis-angle-gripper-normalized-v1
