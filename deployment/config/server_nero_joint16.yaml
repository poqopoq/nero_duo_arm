# LeRobot 0.6.2 remote policy server for the RoboTwin 16-D NERO joint
# checkpoint (right7 + left7 + right_gripper_width + left_gripper_width).
#
# This contract is intentionally different from server_nero_pi05.yaml:
# - pi05_place_apple_box_staged_joint16 emits absolute joint targets in radians
#   and physical gripper widths in metres.
# - It does not use TCP/rot6d IK, so the bridge must run action_schema=joint16.
deployment: nero-bimanual-joint16
model:
  repo_or_path: /Data/zhiyuan/checkpoints/pi05_place_apple_box_staged_joint16/checkpoints/030000/pretrained_model
  revision: null
  device: cuda
execution:
  supported_modes: [chunk]
  action_fps: 30.0
  # The checkpoint predicts 50 steps; execute half before replanning.
  n_action_steps: 25
  action_deadline_s: 5.0
  idle_timeout_s: 10.0
  warmup_calls: 2
language:
  enabled: false
zenoh:
  mode: peer
  listen_endpoints: [tcp/0.0.0.0:7447]
semantics: nero-bimanual-joint16-rad-metres-v1
robot_type: nero_dual_joint16
features:
  - name: observation.state
    shape: [16]
    dtype: float32
    names:
      - right_nero_joint_1
      - right_nero_joint_2
      - right_nero_joint_3
      - right_nero_joint_4
      - right_nero_joint_5
      - right_nero_joint_6
      - right_nero_joint_7
      - left_nero_joint_1
      - left_nero_joint_2
      - left_nero_joint_3
      - left_nero_joint_4
      - left_nero_joint_5
      - left_nero_joint_6
      - left_nero_joint_7
      - right_gripper_width
      - left_gripper_width
    semantics: nero-bimanual-joint16-rad-metres-v1
  - name: observation.images.base_0_rgb
    shape: [224, 224, 3]
    dtype: uint8
    kind: rgb
    semantics: rgb-head-d435-v1
  - name: observation.images.left_wrist_0_rgb
    shape: [224, 224, 3]
    dtype: uint8
    kind: rgb
    semantics: rgb-left-d405-v1
  - name: observation.images.right_wrist_0_rgb
    shape: [224, 224, 3]
    dtype: uint8
    kind: rgb
    semantics: rgb-right-d405-v1
action_feature:
  name: action
  shape: [16]
  dtype: float32
  names:
    - right_nero_joint_1
    - right_nero_joint_2
    - right_nero_joint_3
    - right_nero_joint_4
    - right_nero_joint_5
    - right_nero_joint_6
    - right_nero_joint_7
    - left_nero_joint_1
    - left_nero_joint_2
    - left_nero_joint_3
    - left_nero_joint_4
    - left_nero_joint_5
    - left_nero_joint_6
    - left_nero_joint_7
    - right_gripper_width
    - left_gripper_width
  semantics: nero-bimanual-joint16-rad-metres-v1
